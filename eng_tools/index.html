<!DOCTYPE html>

    <title>TOOLS</title>
    <link rel="icon" href="img/icone.png" type="image/x-icon">

<body>
    <!--menu-->
    <header>
        <nav class="navbar fixed-top bg-body-tertiary" id="menu">
            <div class="container-fluid">
                <a class="navbar-brand" href="#" id="logo">
                    <img src="img/icone.png" alt="Logo" width="24" height="24" class="d-inline-block align-text-top">

    </header>
    <main>
        <section class="container">
            <h1 class="title-h1">CALCULOS</h1>
            <!--Calculo 1-->
            <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne"  id="title-h2">
                            CALCLIB
                        </button>
                    </h2>
                    <div id="collapseOne" class="accordion-collapse collapse">
                        <div class="accordion-body">
                            <div class="container">   
                                <div class="row"  id="inputCalc1">   
                                    <div class="col-9">
                                        <h3 class="title-h3"> </h3>
                                        <form class="row row-cols-lg-auto g-3 align-items-center border border-1 border-secondary-subtle p-3 rounded-3">
                                            <div class="col-3 w-25">
                                                <label class="visually-hidden" for="inlineFormInputGroupUsername">Espessura</label>
                                                <div class="input-group">
                                                    <div class="input-group-text">#</div>
                                                    <input type="text" class="form-control" id="inlineFormInputGroupUsername" placeholder="Espessura">
                                                </div>
                                            </div>
                                            <div class="col-6  w-50">
                                                <label class="visually-hidden" for="inlineFormInputGroupUsername">Diâmetro Externo</label>
                                                <div class="input-group">
                                                    <div class="input-group-text">Ø</div>
                                                    <input type="text" class="form-control" id="inlineFormInputGroupUsername" placeholder="Diâmetro Externo">
                                                </div>
                                            </div>
                                            <div class="col-3 w-25">
                                                <button type="button" class="btn btn-outline-primary w-100">Add Dados</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                                <div class="row" id="tabelaDiam">
                                    <div class="col-6">
                                        <table class="table border border-2 border-secondary-subtle ">
                                            <thead class="table-dark">
                                                <tr>
                                                    <th scope="col"></th>
                                                    <th scope="col">Espessura</th>
                                                    <th scope="col">Externo</th>
                                                    <th scope="col">Interno</th>
                                                </tr>
                                            </thead>
                                            <tbody class=""table-group-divider>
                                                <tr>
                                                    <th scope="row" class="table-dark">Diâmetro</th>
                                                    <td>550</td>
                                                    <td>1125</td>
                                                    <td>2250</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--Fim do Calculo 1-->
            <!--Calculo 2-->
            <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo"  id="title-h2">

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
